<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Corrida Saudável 3D - Menu</title>
    <link rel="stylesheet" href="css/menu.css">
</head>

<body>
    <!-- Menu principal: página própria. O jogo roda em jogo.html.
         O fundo 3D (a rua do jogo) é carregado por js/menu-fundo.js depois que a página aparece. -->
    <main id="ui">
        <header class="logo">
            <!-- corredor (ilustração própria em SVG) -->
            <svg class="runner" viewBox="0 0 230 240" aria-hidden="true">
                <g stroke-linecap="round" stroke-linejoin="round" fill="none">
                    <!-- braço e perna de trás -->
                    <path d="M90 100 L56 112 L50 140" stroke="#e9a47a" stroke-width="15"/>
                    <circle cx="50" cy="144" r="9" fill="#e9a47a" stroke="none"/>
                    <path d="M90 160 L62 198 L34 178" stroke="#e9a47a" stroke-width="17"/>
                    <path d="M18 172 Q14 192 34 192 L52 186 Q52 172 40 170 Z" fill="#2f8ee0" stroke="#173f7a" stroke-width="3"/>
                    <path d="M20 190 L52 186" stroke="#fff" stroke-width="4"/>
                </g>
                <!-- tronco inclinado e bermuda -->
                <path d="M78 98 C92 78 128 80 136 96 L114 154 L74 152 Z" fill="#2f8ee0" stroke="#173f7a" stroke-width="3" stroke-linejoin="round"/>
                <path d="M80 150 L116 152 L130 180 L88 188 Z" fill="#1d1f24" stroke="#0b0c0f" stroke-width="3" stroke-linejoin="round"/>
                <path d="M118 153 L129 178" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
                <g stroke-linecap="round" stroke-linejoin="round" fill="none">
                    <!-- perna da frente (joelho à frente, canela para baixo) -->
                    <path d="M108 176 L150 170 L142 210" stroke="#e9a47a" stroke-width="17"/>
                    <path d="M130 206 Q132 228 154 226 L172 220 Q168 206 154 204 Z" fill="#2f8ee0" stroke="#173f7a" stroke-width="3"/>
                    <path d="M134 226 L172 220" stroke="#fff" stroke-width="4"/>
                    <!-- braço da frente (cotovelo dobrado, punho na altura do queixo) -->
                    <path d="M126 100 L152 126 L180 108" stroke="#e9a47a" stroke-width="15"/>
                    <path d="M124 98 L140 112" stroke="#2f8ee0" stroke-width="22"/>
                </g>
                <circle cx="184" cy="104" r="10" fill="#e9a47a"/>
                <!-- cabeça -->
                <rect x="108" y="70" width="14" height="16" rx="6" fill="#d98f66"/>
                <circle cx="118" cy="54" r="25" fill="#f2b38a"/>
                <path d="M92 52 C90 26 116 20 136 32 C140 38 140 44 138 48 C126 38 112 40 102 48 C98 50 95 54 92 58 Z" fill="#6b3f26"/>
                <ellipse cx="113" cy="60" rx="4" ry="6" fill="#d98f66"/>
                <ellipse cx="131" cy="54" rx="3" ry="4.2" fill="#1d1f24"/>
                <path d="M124 46 L138 44" stroke="#4a2c1a" stroke-width="3" stroke-linecap="round"/>
                <path d="M126 68 Q133 71 138 66" stroke="#a8553a" stroke-width="2.6" fill="none" stroke-linecap="round"/>
            </svg>

            <h1 class="titulo" aria-label="Corrida Saudável">
                <span class="t t1" data-t="Corrida"><span class="fill">Corrida</span></span>
                <span class="t t2" data-t="Saudável"><span class="fill">Saudável</span></span>
            </h1>

            <!-- maçã -->
            <svg class="apple" viewBox="0 0 120 130" aria-hidden="true">
                <defs>
                    <radialGradient id="gMaca" cx="35%" cy="30%" r="80%">
                        <stop offset="0" stop-color="#ff6a5c"/>
                        <stop offset="1" stop-color="#c41a1a"/>
                    </radialGradient>
                </defs>
                <path d="M60 36 C40 20 8 32 10 72 C12 106 40 126 60 120 C80 126 108 106 110 72 C112 32 80 20 60 36Z" fill="url(#gMaca)" stroke="#7d0f12" stroke-width="3"/>
                <ellipse cx="36" cy="58" rx="9" ry="16" fill="#fff" opacity=".45" transform="rotate(20 36 58)"/>
                <path d="M60 38 C58 24 62 16 70 8" stroke="#6b3f1e" stroke-width="7" stroke-linecap="round" fill="none"/>
                <path d="M64 24 C78 6 100 8 108 16 C100 32 80 36 64 24Z" fill="#4cc23e" stroke="#1f7a2a" stroke-width="3"/>
                <path d="M68 24 C82 18 94 18 102 18" stroke="#1f7a2a" stroke-width="2" fill="none"/>
            </svg>

            <!-- cenoura -->
            <svg class="carrot" viewBox="0 0 100 210" aria-hidden="true">
                <defs>
                    <linearGradient id="gCen" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0" stop-color="#ffa23a"/>
                        <stop offset="1" stop-color="#e85d12"/>
                    </linearGradient>
                </defs>
                <path d="M52 60 C40 30 30 16 22 6 C44 8 56 28 54 60Z" fill="#3fb83a" stroke="#1f7a2a" stroke-width="3"/>
                <path d="M54 60 C56 26 66 10 80 2 C84 26 70 46 58 62Z" fill="#52cc44" stroke="#1f7a2a" stroke-width="3"/>
                <path d="M30 60 C18 64 16 76 22 96 L50 200 C52 206 58 206 60 200 L84 96 C90 76 86 64 74 60 Z" fill="url(#gCen)" stroke="#9a3a08" stroke-width="3" stroke-linejoin="round"/>
                <g stroke="#b8470c" stroke-width="3" stroke-linecap="round" fill="none" opacity=".7">
                    <path d="M30 84 Q52 92 70 82"/>
                    <path d="M36 118 Q54 124 68 116"/>
                    <path d="M42 152 Q54 158 62 150"/>
                </g>
                <path d="M32 72 C28 90 34 112 42 134" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none" opacity=".35"/>
            </svg>

            <svg class="swoosh" viewBox="0 0 620 60" aria-hidden="true" preserveAspectRatio="none">
                <path d="M4 40 Q300 2 616 10 Q330 34 150 54 Q50 58 4 40Z" fill="#0e2a43"/>
                <path d="M16 38 Q300 8 598 13 Q330 32 152 48 Q64 52 16 38Z" fill="#fff"/>
                <path d="M34 37 Q300 15 566 18 Q330 30 160 43 Q82 46 34 37Z" fill="#3cc43a"/>
            </svg>
        </header>

        <nav class="botoes">
            <button id="m-play" class="b-jogar">
                <svg viewBox="0 0 40 44" aria-hidden="true"><path d="M8 4 L36 22 L8 40 Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg>
                <span>Jogar</span>
            </button>

            <div class="b-diff" role="group" aria-label="Dificuldade">
                <svg class="gear" viewBox="0 0 48 48" aria-hidden="true">
                    <path fill="#fff" fill-rule="evenodd" d="M20 4h8l1.4 6.2 3.6 1.5 5.4-3.4 5.6 5.6-3.4 5.4 1.5 3.6L48 20v8l-6.2 1.4-1.5 3.6 3.4 5.4-5.6 5.6-5.4-3.4-3.6 1.5L28 44h-8l-1.4-6.2-3.6-1.5-5.4 3.4-5.6-5.6 3.4-5.4-1.5-3.6L0 28v-8l6.2-1.4 1.5-3.6-3.4-5.4 5.6-5.6 5.4 3.4 3.6-1.5L20 4Zm4 12a8 8 0 1 0 0 16 8 8 0 0 0 0-16Z" transform="translate(0 2) scale(.96)"/>
                </svg>
                <span class="lbl">Dificuldade:</span>
                <button id="d-prev" class="arrow" aria-label="Dificuldade anterior">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 L7 12 L15 20" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <span id="d-val" class="val" data-d="normal" aria-live="polite">Normal</span>
                <button id="d-next" class="arrow" aria-label="Próxima dificuldade">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 L17 12 L9 20" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
            </div>

            <button id="m-rules" class="b-regras">
                <svg viewBox="0 0 40 48" aria-hidden="true">
                    <path d="M6 2h20l10 10v32a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z" fill="#fff"/>
                    <path d="M26 2v10h10" fill="#cfe0f7"/>
                    <g fill="#2a6fd0"><circle cx="11" cy="22" r="2.2"/><circle cx="11" cy="30" r="2.2"/><circle cx="11" cy="38" r="2.2"/></g>
                    <g stroke="#2a6fd0" stroke-width="3" stroke-linecap="round"><path d="M17 22h15"/><path d="M17 30h15"/><path d="M17 38h15"/></g>
                </svg>
                <span>Regras</span>
            </button>
        </nav>

        <p class="info"><span id="m-stats"></span><small id="m-diffdesc"></small></p>
    </main>

    <button id="m-sound" class="som" aria-label="Som">🔊</button>

    <!-- Regras (janela) -->
    <div id="modal" class="modal" hidden>
        <div class="card" role="dialog" aria-modal="true" aria-labelledby="modal-t">
            <h2 id="modal-t">📖 Como jogar</h2>
            <div id="r-body" class="rules"></div>
            <button id="m-fechar" class="b-regras fechar">← Voltar</button>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/menu.js"></script>
    <!-- por último: carrega Three.js + a rua do jogo como fundo (se falhar, o menu continua funcionando) -->
    <script src="js/menu-fundo.js"></script>
</body>
</html>
